<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фриланс-биржа</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        /* Navbar */
        .navbar {
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .brand {
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        /* Hero */
        .hero-section {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .hero-content {
            max-width: 700px;
            margin: auto;
            text-align: center;
        }

        .hero-content h1 {
            font-weight: 700;
        }

        .hero-content p {
            opacity: .9;
        }

        .btn-register {
            margin-left: .5rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
    <div class="container">
        <a href="/" class="brand">Фриланс-биржа</a>

        <div class="ms-auto">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('profile.profile', username=current_user.username) }}"
                   class="btn btn-outline-primary btn-register">
                    Профиль
                </a>
                <a href="{{ url_for('auth.logout') }}"
                   class="btn btn-primary btn-register">
                    Выйти
                </a>
            {% else %}
                <a href="{{ url_for('auth.registration') }}"
                   class="btn btn-primary btn-register">
                    Регистрация
                </a>
                <a href="{{ url_for('auth.login') }}"
                   class="btn btn-outline-secondary btn-register">
                    Вход
                </a>
            {% endif %}
        </div>
    </div>
</nav>

{% for cat, msg in get_flashed_messages(True) %}
<div class="alert alert-{{ 'danger' if cat == 'error' else 'success' }} mx-auto mb-3"
     style="max-width: 600px;">
    {{ msg }}
</div>
{% endfor %}

{% block content %}
<section class="hero-section">
    <div class="container">
        <div class="hero-content">
            <h1 class="display-5 mb-3">
                {% block h1 %}{% endblock %}
            </h1>

            <div class="lead mb-4">
                {% block p %}{% endblock %}
            </div>
        </div>
    </div>
</section>
{% endblock %}

</body>
</html>
